name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PERSONAL_AUTH_TOKEN: ${{ secrets.TAP_GORELEASER_TOKEN }}

  vsix:
    name: Build and upload VSIX
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: microsoft/setup-msbuild@v3

      - name: Set extension version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Tag is not a valid VSIX version: $env:GITHUB_REF_NAME" }

          foreach ($manifest in 'extension\format\source.extension.vsixmanifest', 'extension\format15\source.extension.vsixmanifest') {
            $content = Get-Content $manifest -Raw
            $content = $content -replace '(?<=<Identity[^>]*Version=")[0-9]+(\.[0-9]+)*', $version
            Set-Content -Path $manifest -Value $content -NoNewline -Encoding utf8
          }

          $source = 'extension\format\source.extension.cs'
          $content = Get-Content $source -Raw
          $content = $content -replace 'public const string Version = "[0-9]+(\.[0-9]+)*"', ('public const string Version = "' + $version + '"')
          Set-Content -Path $source -Value $content -NoNewline -Encoding utf8

          Write-Host "Extension version set to $version"

      # stformat-<version>.vsix: Visual Studio 2022+ and the 64-bit XAE Shell (4026).
      # stformat-<version>-vs2017.vsix: Visual Studio 2017/2019 and the 32-bit XAE Shell (4024).
      - name: Build VSIXs
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($build in @(@('format', ''), @('format15', '-vs2017'))) {
            $project = $build[0]
            msbuild "extension\$project\$project.csproj" /t:Restore /p:Configuration=Release /p:Platform=AnyCPU
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild "extension\$project\$project.csproj" /t:Build /p:Configuration=Release /p:Platform=AnyCPU /p:DeployExtension=false /p:BuildVSIXContainer=true /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $vsix = Join-Path (Get-Location) "extension\$project\bin\Release\format.vsix"
            if (-not (Test-Path $vsix)) { throw "VSIX not produced: $vsix" }
            Copy-Item $vsix (Join-Path (Get-Location) "dist\stformat-$version$($build[1]).vsix") -Force
          }

      - name: Upload VSIX to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist\*.vsix --clobber
