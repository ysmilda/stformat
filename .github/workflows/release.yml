name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.1
          args: release --clean
          docker_username: ${{ github.actor }}
          docker_password: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PERSONAL_AUTH_TOKEN: ${{ secrets.TAP_GORELEASER_TOKEN }}

  vsix:
    name: Build and upload VSIX
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: microsoft/setup-msbuild@v2

      - name: Set extension version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Tag is not a valid VSIX version: $env:GITHUB_REF_NAME" }

          $manifest = 'extension\format\source.extension.vsixmanifest'
          $content = Get-Content $manifest -Raw
          $content = $content -replace '(?<=<Identity[^>]*Version=")[0-9]+(\.[0-9]+)*', $version
          Set-Content -Path $manifest -Value $content -NoNewline -Encoding utf8

          $source = 'extension\format\source.extension.cs'
          $content = Get-Content $source -Raw
          $content = $content -replace 'public const string Version = "[0-9]+(\.[0-9]+)*"', ('public const string Version = "' + $version + '"')
          Set-Content -Path $source -Value $content -NoNewline -Encoding utf8

          Write-Host "Extension version set to $version"

      - name: Restore VSIX project
        shell: pwsh
        run: >
          msbuild extension\format\format.csproj
          /t:Restore
          /p:Configuration=Release
          /p:Platform=AnyCPU

      - name: Build VSIX
        shell: pwsh
        run: >
          msbuild extension\format\format.csproj
          /t:Build
          /p:Configuration=Release
          /p:Platform=AnyCPU
          /p:ReferencePath="$env:GITHUB_WORKSPACE\extension\format\References"
          /p:DeployExtension=false
          /p:BuildVSIXContainer=true
          /v:m

      - name: Stage VSIX artifact
        shell: pwsh
        run: |
          $vsix = Join-Path (Get-Location) 'extension\format\bin\Release\format.vsix'
          if (-not (Test-Path $vsix)) { throw "VSIX not produced: $vsix" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Copy-Item $vsix (Join-Path (Get-Location) "dist\stformat-$version.vsix") -Force

      - name: Upload VSIX to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist\*.vsix --clobber
