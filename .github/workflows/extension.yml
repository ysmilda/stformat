name: Extension

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/extension.yml
  pull_request:
    branches: [main]
    paths:
      - 'extension/**'
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/extension.yml

permissions:
  contents: read

jobs:
  vsix:
    name: Build VSIX
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # format.csproj runs `go build` for Resources\stformat.exe.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: microsoft/setup-msbuild@v3

      # format: Visual Studio 2022+ and the 64-bit TwinCAT XAE Shell (4026).
      # format15: Visual Studio 2017/2019 and the 32-bit XAE Shell (4024).
      - name: Build VSIXs
        run: |
          foreach ($project in 'format', 'format15') {
            msbuild "extension\$project\$project.csproj" /t:Restore /p:Configuration=Release /p:Platform=AnyCPU
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild "extension\$project\$project.csproj" /t:Build /p:Configuration=Release /p:Platform=AnyCPU /p:DeployExtension=false /p:BuildVSIXContainer=true /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $vsix = "extension\$project\bin\Release\format.vsix"
            if (-not (Test-Path $vsix)) { throw "VSIX not produced: $vsix" }
          }