version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ysmilda/stformat

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-naming
  exclusions:
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - gosec
      - linters:
          - gosec
        text: "G115|G304|G306|G703"