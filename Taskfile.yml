version: "3"

vars:
  GOLANGCI_VERSION: v2.13.2
  GORELEASER_VERSION: v2.18.1
  LINT_CMD: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}
  GORELEASER_CMD: go run github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}}

tasks:
  default:
    desc: Build, vet, test and lint
    cmds:
      - task: build
      - task: vet
      - task: test
      - task: lint

  build:
    desc: Build the stformat CLI binary
    cmds:
      - go build .

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-verbose:
    desc: Run all tests verbosely
    cmds:
      - go test -v ./...

  bench:
    desc: Run the formatter benchmarks over handlers/benchdata
    cmds:
      - go test ./handlers -run XXX -bench . -benchtime 200x

  bench-profile:
    desc: Run the ST benchmark and write CPU and memory profiles for pprof
    cmds:
      # -o pins the test binary name: go test would otherwise leave it as
      # handlers.test.exe on Windows and pprof cannot find it by the bare name.
      - go test ./handlers -run XXX -bench BenchmarkCorpusST -benchtime 2000x -cpuprofile cpu.out -memprofile mem.out -o handlers.test
      - go tool pprof -top -nodecount=25 handlers.test cpu.out
      - go tool pprof -sample_index=alloc_space -top -nodecount=25 handlers.test mem.out

  golden:
    desc: Regenerate golden testdata files
    cmds:
      - go test ./handlers -run 'TestSTFiles|TestXMLFiles' -update

  vet:
    desc: Run go vet static analysis
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go source files with gofmt
    cmds:
      - gofmt -w .

  lint:
    desc: Run golangci-lint
    cmds:
      - "{{.LINT_CMD}} run ./..."

  lint-fix:
    desc: Run golangci-lint and apply fixes
    cmds:
      - "{{.LINT_CMD}} run ./... --fix"

  release-check:
    desc: Validate the goreleaser configuration
    cmds:
      - "{{.GORELEASER_CMD}} check"

  release-snapshot:
    desc: Build a snapshot release locally without publishing
    cmds:
      - "{{.GORELEASER_CMD}} release --snapshot --clean --skip=publish"